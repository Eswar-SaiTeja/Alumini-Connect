services:
  - type: web
    name: gcrjy-alumni-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: cd server && npx prisma db push && npx tsx prisma/seed.ts && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
