version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcrjy-alumni-platform
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super_secret_jwt_key_gcrjy_alumni_2026
    volumes:
      - ./data/uploads:/app/server/uploads
      - ./data/db:/app/server/prisma
